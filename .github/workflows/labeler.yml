name: labeler

# Labels pull requests: an area from the paths they change (.github/labeler.yml) and a type from the
# title's prefix (fix → bug, feat → enhancement, docs → documentation, perf → performance).
# pull_request_target with no checkout of the pull request: the write token never runs its code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const types = { fix: "bug", feat: "enhancement", docs: "documentation", perf: "performance" };
            const pr = context.payload.pull_request;
            const prefix = (pr.title.match(/^(\w+)(?:\([^)]*\))?!?:/) || [])[1];
            const label = types[prefix?.toLowerCase()];
            if (label && !pr.labels.some((l) => l.name === label)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [label] });
            }
