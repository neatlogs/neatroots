name: triage

# The issue forms label every new issue needs-triage. One opened through the API or the GitHub CLI skips
# the forms, so it arrives with no labels at all: label it needs-triage too. One opened with labels is
# left alone.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  needs-triage:
    if: join(github.event.issue.labels.*.name, ',') == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ["needs-triage"] });
