name: pr-limit

# At most 5 open pull requests per contributor (CONTRIBUTING.md). A new pull request over the limit
# becomes a draft, labeled over-limit, with one comment; pull requests opened before this existed are
# left alone. pull_request_target with no checkout: the write token never runs contributor code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  limit:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const limit = 5;
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            const mine = open.filter((p) => p.user.login === pr.user.login).length;
            if (mine <= limit) return;
            if (!pr.draft) {
              await github.graphql(
                "mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { isDraft } } }",
                { id: pr.node_id },
              );
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["over-limit"] });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body:
                `Thanks for the pull request! You have ${mine} open pull requests, and neatroots reviews at most ${limit} ` +
                `per contributor at a time ([CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md#limits)), ` +
                `so this one is now a draft. Mark it ready for review once another of yours is merged or closed.`,
            });
