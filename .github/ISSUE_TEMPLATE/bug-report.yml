name: Bug report
description: Something in neatroots doesn't work
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste API keys or customer data from your runs.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. neatroots start
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and machine
      description: "`neatroots --version`, OS, and how the agent sends runs (SDK, OpenTelemetry, HTTP API, import)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The terminal running `neatroots start`, or ~/.neatroots/logs/neatroots.log. `neatroots doctor` output helps too.
      render: text
