# Groups the notes the release workflow generates (gh release create --generate-notes) by label.
# For a final release they're replaced with curated notes (docs/releasing.md).
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Security
      labels: [security]
    - title: Bug fixes
      labels: [bug]
    - title: Features
      labels: [enhancement]
    - title: Performance
      labels: [performance]
    - title: Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
